# Needs an ingress controller (written for ingress-nginx). Replace the host with your own domain.
# Only the web service is exposed: its nginx forwards /api and /socket.io to the backend inside the cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hellojess
  annotations:
    # Keep WebSocket connections open.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: hellojess.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
