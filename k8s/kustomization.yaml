apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hellojess
resources:
  - namespace.yaml
  - postgres.yaml
  - backend.yaml
  - web.yaml
  - ingress.yaml
# The secret "hellojess-secrets" (postgres-password, secret-key) is not stored in git:
# create it once with k8s/README.md, or let the CI/CD pipeline do it from GitHub secrets.
